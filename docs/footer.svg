      <stop offset="0" stop-color="#101211"/>
      <stop offset="1" stop-color="#202421"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#B7FF35" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#B7FF35" stop-opacity="0"/>
